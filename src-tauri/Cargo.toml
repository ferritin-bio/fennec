[package]
name = "fennec"
version = "0.1.0"
description = "Local-First Protein App"
authors = ["zach charlop-powers"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fennec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
bio = "4.0.0"
ferritin-core = {  git = "https://github.com/ferritin-bio/ferritin.git", package = "ferritin-core"}
ferritin-onnx-models = {   git = "https://github.com/ferritin-bio/ferritin.git", package = "ferritin-onnx-models"}
ferritin-plms = {  git = "https://github.com/ferritin-bio/ferritin.git", package = "ferritin-plms"}
noodles-fasta = "0.62.0"
noodles-fastq = "0.23.0"
protein-translate = "0.2.0"
rnapkin = "0.3.9"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
tempfile = "3.27.0"


[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", features = ["metal"] }
candle-examples = { version = "0.10.2", features = ["metal"] }
candle-nn = { version = "0.10.2", features = ["metal"] }
candle-transformers = { version = "0.10.2", features = ["metal"] }
candle-metal-kernels = "0.10.2"

[features]
metal = ["ferritin-plms/metal"]


[target.'cfg(target_os = "macos")'.features]
metal = []
